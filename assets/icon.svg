<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>GR4-XPanUnlock</title>
  <!-- Open-gate live view: the whole frame, dimmed by half outside a 65:24 band,
       with a thin white line at each crop edge. Band: 512 x 189.05, y 161.48-350.52. -->
  <defs>
    <clipPath id="frame"><rect width="512" height="512" rx="92"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E4A6B"/>
      <stop offset=".55" stop-color="#9C7A8C"/>
      <stop offset="1" stop-color="#E98F5E"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E6080"/>
      <stop offset="1" stop-color="#2A3D58"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="276" fill="url(#sky)"/>
    <circle cx="338" cy="161.5" r="58" fill="#FFEBC2"/>
    <rect y="276" width="512" height="236" fill="url(#sea)"/>
    <g fill="#FFD7A1">
      <rect x="286" y="284" width="104" height="7" rx="3.5"/>
      <rect x="296" y="301" width="84" height="7" rx="3.5"/>
      <rect x="305" y="319" width="66" height="7" rx="3.5"/>
      <rect x="312" y="338" width="52" height="7" rx="3.5"/>
      <rect x="318" y="358" width="40" height="7" rx="3.5"/>
      <rect x="323" y="380" width="30" height="7" rx="3.5"/>
      <rect x="327" y="404" width="22" height="7" rx="3.5"/>
      <rect x="330.5" y="430" width="15" height="7" rx="3.5"/>
      <rect x="333" y="458" width="10" height="7" rx="3.5"/>
    </g>
    <g fill="#000" fill-opacity=".5">
      <rect width="512" height="161.48"/>
      <rect y="350.52" width="512" height="161.48"/>
    </g>
    <g fill="#FFF">
      <rect y="159" width="512" height="5"/>
      <rect y="348" width="512" height="5"/>
    </g>
  </g>
</svg>
